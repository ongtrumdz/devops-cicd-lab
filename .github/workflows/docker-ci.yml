name: Lab 8.8 - Build Test Push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-cicd-lab:v1 .

      - name: Run Nginx container
        run: |
          docker run -d \
            --name web-ci \
            -p 127.0.0.1:8088:80 \
            devops-cicd-lab:v1

      - name: Test website
        run: |
          set -euo pipefail

          READY=false

          for i in $(seq 1 15); do
            if curl -fsS --max-time 5 \
              http://127.0.0.1:8088/ \
              -o /tmp/index.html; then
              READY=true
              break
            fi

            echo "Waiting for Nginx ($i/15)"
            sleep 2
          done

          if [ "$READY" != "true" ]; then
            echo "Nginx is not ready"
            docker logs web-ci
            exit 1
          fi

          grep -Fq "DevOps CI Lab 8.7" /tmp/index.html
          echo "HTTP TEST PASSED"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Tag and Push image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:v1"

          docker tag devops-cicd-lab:v1 "$IMAGE"
          docker push "$IMAGE"

          echo "Published: $IMAGE"

      - name: Cleanup container
        if: always()
        run: docker rm -f web-ci || true
