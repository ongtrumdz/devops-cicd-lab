name: Lab 8.7 - Docker Build and Test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-cicd-lab:8.7 .

      - name: Run Nginx container
        run: |
          docker run -d \
            --name web-ci \
            -p 127.0.0.1:8088:80 \
            devops-cicd-lab:8.7

      - name: Test website
        run: |
          set -euo pipefail

          for i in $(seq 1 15); do
            if curl -fsS --max-time 3 \
              http://127.0.0.1:8088/ \
              -o /tmp/index.html; then

              if grep -Fq "DevOps CI Lab 8.7" /tmp/index.html; then
                echo "HTTP test PASSED!"
                exit 0
              else
                echo "ERROR: Website content is incorrect"
                cat /tmp/index.html
                exit 1
              fi
            fi

            echo "Waiting for Nginx ($i/15)..."
            sleep 2
          done

          echo "ERROR: Nginx did not become ready"
          docker ps -a
          docker logs web-ci
          exit 1

      - name: Cleanup container
        if: always()
        run: docker rm -f web-ci || true
